<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>jQuery migration regression</title>
<link rel="stylesheet" href="../styles/resource/css/base/jquery.fancybox.css">
<script>var ogame={};var migrationErrors=[];window.addEventListener("error",function(e){migrationErrors.push(e.message);});</script>
<script src="../scripts/base/jquery.js?v=4.0.0"></script>
<script src="../scripts/base/jquery.ui.js?v=1.14.2"></script>
<script src="../scripts/base/jquery.fancybox.js"></script>
<script src="../scripts/base/jquery.tablesorter.js"></script>
<script src="../scripts/base/jquery.validationEngine.js"></script>
<script src="../scripts/l18n/validationEngine/jquery.validationEngine-en.js"></script>
<script src="../scripts/base/jquery.cookie.js"></script>
<script src="../scripts/base/jquery.autosize-min.js"></script>
<script src="../styles/resource/js/tooltipster.bundle.min.js"></script>
<script src="../scripts/game/navigation.js"></script>
<button id="run" type="button">Run isolated validation tests</button>
<pre id="results">Not run</pre>
<div id="fixture"></div>
<script>
$(function () {
    $('#run').on('click', async function () {
        var results = [];
        function check(value, name) {
            if (!value) throw new Error(name);
            results.push('PASS ' + name);
        }
        try {
            check($.fn.jquery === '4.0.0', 'jQuery 4.0.0 loaded');
            check($.ui.version === '1.14.2', 'jQuery UI 1.14.2 loaded');
            check(migrationErrors.length===0,'plugin scripts load without errors: '+migrationErrors.join('; '));
            check(typeof initEmpireEquipment==='function','legacy navigation definitions loaded');
            check(typeof $.trim === 'undefined' && typeof $.isFunction === 'undefined', 'no removed API shims');
            $.cookie('gala-migration-fixture', 'round-trip', {path:'/tests'});
            check($.cookie('gala-migration-fixture') === 'round-trip', 'cookie round trip');
            $.cookie('gala-migration-fixture', null, {path:'/tests'});
            var textarea=$('<textarea>Line one</textarea>').appendTo('#fixture').autosize();
            check(textarea.data('mirror') && textarea.height()>0, 'autosize initializes');
            textarea.val('One\nTwo\nThree').trigger('autosize');
            check(textarea.height()>0, 'autosize updates');
            textarea.data('mirror').remove();textarea.remove();
            var tip=$('<span title="Fixture tooltip">Fixture</span>').appendTo('#fixture');
            tip.tooltipster({animationDuration:0});tip.tooltipster('open');
            check($('.tooltipster-content').text().includes('Fixture tooltip'), 'Tooltipster opens');
            tip.tooltipster('close').tooltipster('destroy');tip.remove();
            var slider=$('<div></div>').appendTo('#fixture').slider({value:35});
            check(slider.slider('value')===35,'jQuery UI slider');slider.slider('destroy').remove();
            var dialog=$('<div>Fixture dialog</div>').appendTo('#fixture').dialog({autoOpen:false});
            dialog.dialog('open');check(dialog.dialog('isOpen'),'jQuery UI dialog');dialog.dialog('destroy').remove();
            var response=await $.ajax({url:'jquery-migration.html',dataType:'html'});
            check(response.includes('jQuery migration regression'),'AJAX HTML GET');
            var source = JSON.parse('{"__proto__":{"migrationPolluted":true}}');
            $.extend(true, {}, source);
            check(({}).migrationPolluted === undefined, 'prototype pollution blocked');
            var progress = $('<div></div>').appendTo('#fixture').progressbar({value: 65});
            check(progress.progressbar('value') === 65, 'jQuery UI progressbar');
            progress.progressbar('destroy').remove();
            var table = $('<table><thead><tr><th>Number</th></tr></thead><tbody><tr><td>2</td></tr><tr><td>1</td></tr></tbody></table>').appendTo('#fixture');
            table.tablesorter({sortList: [[0,0]]});
            check(table.find('tbody tr:first td').text() === '1', 'tablesorter ascending');
            table.remove();
            $.fancybox('<p id="migration-lightbox">Migration test</p>', {transitionIn:'none',transitionOut:'none'});
            await new Promise(function(resolve) {setTimeout(resolve,100);});
            check($('#migration-lightbox').length === 1, 'Fancybox opens');
            $.fancybox.close();
            var form = $('<form id="migration-form"></form>').appendTo('#fixture');
            form.validationEngine('attach', {bindMethod: 'live', scroll: false, focusFirstField: false});
            var field = $('<input id="migration-required" class="validate[required]">').appendTo(form);
            field.trigger('blur');
            await new Promise(function (resolve) { setTimeout(resolve, 30); });
            check($('.formError').length === 1, 'dynamic required field validates');
            form.validationEngine('detach');
            $('.formError').remove();
            field.trigger('blur');
            await new Promise(function (resolve) { setTimeout(resolve, 30); });
            check($('.formError').length === 0, 'detach removes delegated field validation');
            form.validationEngine('attach', {bindMethod: 'live', scroll: false, focusFirstField: false});
            field.trigger('blur');
            await new Promise(function (resolve) { setTimeout(resolve, 30); });
            check($('.formError').length === 1, 'reattach validates once');
            field.val('valid');
            check(form.validationEngine('validate') === true, 'filled required field passes');
            form.validationEngine('detach');
            form.remove();
            $('#results').text(results.join('\n'));
        } catch (error) {
            $('#results').text(results.join('\n') + '\nFAIL ' + error.message);
        }
    });
});
</script>
</html>
